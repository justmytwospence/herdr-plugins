id = "agent-cycle"
name = "Agent Cycle"
version = "0.1.0"
min_herdr_version = "0.9.3"
description = "Order the Agents list so next_agent visits what needs you first (blocked, then sessions whose prompt cache expires soon, then done), then everything else least recently visited first, and agents only waiting on background work last."
platforms = ["macos", "linux"]

# `python3 -B` so no __pycache__ is written into the plugin checkout.

[[startup]]
command = ["python3", "-B", "cycle.py", "sync"]

[[events]]
on = "pane.agent_status_changed"
command = ["python3", "-B", "cycle.py", "sync"]

[[events]]
on = "pane.agent_detected"
command = ["python3", "-B", "cycle.py", "sync"]

# Tokens change without a status event: re-rank a pane whose wait on background work
# started or ended (any other update exits without a call).
[[events]]
on = "pane.updated"
command = ["python3", "-B", "cycle.py", "updated"]

[[events]]
on = "pane.focused"
command = ["python3", "-B", "cycle.py", "focus"]

[[actions]]
id = "sync"
title = "Re-sync the Agents cycle order"
contexts = ["global"]
command = ["python3", "-B", "cycle.py", "sync"]

[[actions]]
id = "next-block"
title = "Next agent outside this repo's spaces"
contexts = ["global"]
command = ["python3", "-B", "cycle.py", "next-block"]
