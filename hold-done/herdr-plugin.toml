id = "hold-done"
name = "Hold Done"
version = "0.1.0"
min_herdr_version = "0.9.3"
description = "Keep finished agents in the Agents list's done slot until you act on them, instead of when you look at them."
platforms = ["macos", "linux"]

# `python3 -B` so no __pycache__ is written into the plugin checkout.

[[startup]]
command = ["python3", "-B", "hold_done.py", "sync"]

[[events]]
on = "pane.agent_status_changed"
command = ["python3", "-B", "hold_done.py", "sync"]

[[events]]
on = "pane.agent_detected"
command = ["python3", "-B", "hold_done.py", "sync"]

[[actions]]
id = "release"
title = "Release the focused agent from done"
contexts = ["pane"]
command = ["python3", "-B", "hold_done.py", "release"]

[[actions]]
id = "release-all"
title = "Release every agent from done"
contexts = ["global"]
command = ["python3", "-B", "hold_done.py", "release-all"]

[[actions]]
id = "sync"
title = "Re-sync Agents list order"
contexts = ["global"]
command = ["python3", "-B", "hold_done.py", "sync"]
